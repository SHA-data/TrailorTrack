name: Supabase Free-Tier Keep-Alive

on:
  schedule:
    # Run every 4 days at 06:00 UTC to prevent Supabase auto-pausing after 7 days of inactivity
    - cron: '0 6 */4 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive Endpoint
        env:
          APP_URL: ${{ secrets.PRODUCTION_APP_URL || 'https://tailortrack.vercel.app' }}
        run: |
          echo "Pinging ${APP_URL}/api/health ..."
          curl -f -s -S "${APP_URL}/api/health" || echo "Ping dispatched"
